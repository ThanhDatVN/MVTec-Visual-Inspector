# Local mirror of the CI gates. The license guard runs here too, because the
# obligation it enforces cannot be undone once a commit is pushed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: license-guard
        name: no dataset images may be committed (CC BY-NC-SA)
        entry: python -m pytest tests/test_license_guard.py -q
        language: system
        pass_filenames: false
        always_run: true
