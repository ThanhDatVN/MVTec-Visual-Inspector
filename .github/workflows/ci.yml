name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  # The obligation whose violation cannot be undone once pushed, so it runs
  # first and independently of everything else (docs/08 §2).
  license-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the history check needs the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install pytest
      - name: No dataset bytes in tree or history
        run: pytest tests/test_license_guard.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src/inspector

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # No torch, no GPU, no dataset: the data, metrics and fixture layers are
      # torch-free precisely so this job stays fast and runs everywhere.
      - run: pip install -e ".[dev]"
      - name: Unit, property and leakage tests
        run: pytest -v --cov=inspector --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generate fixtures and audit them end to end
        run: |
          inspector --version
          inspector info
          inspector fixtures --out /tmp/fx --overwrite
          inspector audit -c configs/data/synth_strip.yaml --data-root /tmp/fx --write-manifests /tmp/manifests
      - name: Fixture generation is reproducible
        run: |
          inspector fixtures --out /tmp/fx2 --overwrite
          diff -r /tmp/fx /tmp/fx2
