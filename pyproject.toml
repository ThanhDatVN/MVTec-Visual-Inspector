[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtec-visual-inspector"
version = "0.1.0"
description = "Industrial defect detection and localization from normal-only training data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thanh" }]

# Core dependencies. Deliberately split: the data/metrics/fixture layers are
# torch-free so the test suite runs in CI without a GPU or a 2.5 GB wheel.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python-headless>=4.9",
]
track = [
    "mlflow>=2.12",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "gradio>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "pre-commit>=3.7",
]
all = [
    "mvtec-visual-inspector[torch,track,serve,dev]",
]

[project.scripts]
inspector = "inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inspector = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "needs_dataset: requires the real MVTec dataset on disk (skipped in CI)",
    "needs_torch: requires torch/torchvision",
    "needs_gpu: requires a CUDA device",
    "slow: takes more than ~10 seconds",
    "golden: golden-file regression test",
]
filterwarnings = ["error::DeprecationWarning:inspector.*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "NPY"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B905",    # zip strict= is py310+, we set it explicitly where it matters
    "N812",    # `import torch.nn.functional as F` is the universal torch idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/inspector"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
