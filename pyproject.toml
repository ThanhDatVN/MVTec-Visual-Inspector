[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtec-visual-inspector"
version = "0.1.0"
description = "Industrial defect detection and localization from normal-only training data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thanh" }]

# Core dependencies: exactly what `src/inspector` imports on the torch-free path,
# verified by grep (review F11). The data, metrics, EDA, transforms and fixture
# layers need these and nothing else, so CI runs the suite without a GPU or a
# 2.5 GB wheel.
#
# numpy>=2.0 is a real floor, not a guess: the metrics call `np.trapezoid`,
# which does not exist before NumPy 2.0.
#
# scikit-learn is deliberately absent. It was used for two functions, and on
# Windows it imports pyarrow, whose DLL Smart App Control blocks; sklearn's own
# guard catches ModuleNotFoundError but not the ImportError that a blocked DLL
# raises, so one unused transitive package made the whole suite unimportable.
# ROC-AUC, average precision and PCA are implemented in metrics/ranking.py.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    # Peak host memory per pipeline stage (utils/memory.py). Host RAM is this
    # project's binding constraint, so the measurement belongs to every run.
    "psutil>=5.9",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",          # only the vendored anomalib comparator (models/reference) uses it
]
track = [
    "mlflow>=2.12",
]
notebook = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "ipykernel>=6.29",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "gradio>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "pre-commit>=3.7",
]
all = [
    "mvtec-visual-inspector[torch,track,serve,dev]",
]

[project.scripts]
inspector = "inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inspector = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "needs_dataset: requires the real MVTec dataset on disk (skipped in CI)",
    "needs_torch: requires torch/torchvision",
    "needs_gpu: requires a CUDA device",
    "slow: takes more than ~10 seconds",
    "golden: golden-file regression test",
]
filterwarnings = ["error::DeprecationWarning:inspector.*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Third-party code excerpted verbatim as a test oracle; linting it would mean editing it.
extend-exclude = ["tests/reference", "src/inspector/models/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "NPY"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B905",    # zip strict= is py310+, we set it explicitly where it matters
    "N812",    # `import torch.nn.functional as F` is the universal torch idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/inspector"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false

# Third-party code vendored verbatim (anomalib v2.3.0); its upstream typing is kept as is.
[[tool.mypy.overrides]]
module = "inspector.models.reference.*"
ignore_errors = true
