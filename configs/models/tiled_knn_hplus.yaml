# ViT-H+/16 variant of configs/models/tiled_knn.yaml (SuperADD's backbone). Tiled foundation-feature kNN (src/inspector/models/tiled_knn.py), after SuperADD
# (arXiv:2605.14808): DINOv3 blocks, 640 px tiles over the image scaled by 0.625, a density-
# subsampled bank per block, brightness augmentation of the training images. A development
# configuration; a frozen recipe for a held-out test is a separate file under configs/recipes/.
# Compose after a data config:
#   inspector run -c configs/data/mvtec_ad2.yaml -c configs/models/tiled_knn.yaml --categories ...

experiment:
  tier: T3
  owner: own

preprocess:
  resize_mode: none   # the model scales and tiles internally
  long_side: null

model:
  name: tiled_knn
  backbone: vit_huge_plus_patch16_dinov3
  weights: lvd1689m
  layers: [7, 15, 23, 31]
  scale: 0.625
  tile: 640
  overlap: 128
  brightness: [0.8, 1.2]
  candidate_fraction: 0.1
  bank_size: 100000
  density_neighbors: 100
  subset_size: 4096
  image_score: max
  compute: bf16   # fp32 weights (3.4 GB) do not fit a 4 GB card
  tile_batch: 2
