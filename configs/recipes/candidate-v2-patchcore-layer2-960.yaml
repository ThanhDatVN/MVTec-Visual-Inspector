# CANDIDATE recipe v2 — NOT CONFIRMED on MVTec AD 2 (E13, ADR-13): no detection gain over v1
# (macro image AUROC +0.004), AU-PRO higher on 6 of 8 categories against a rule of 7. Kept as a
# record of what was tested; v1 remains the recipe.
# Selected on the development categories by the Gate E
# follow-up (E8, reports/08-gate-e-followup.md): `layer2` features at a 960 px long side, the
# variant with the largest AU-PRO gain that passed DR-1. Everything else is the v1 recipe.
#
# The nine VisA confirmation categories (ADR-11) and MPDD (ADR-12) are spent, so this file
# makes no claim about held-out data. Confirming it needs data that shaped nothing (MVTec AD 2),
# pre-registered in an ADR that freezes this file first.

experiment:
  tier: T3
  owner: own

model:
  name: patchcore
  backbone: wide_resnet50_2
  weights: IMAGENET1K_V1
  layers: [layer2]
  patch_pool: 3
  projection_dim: 1024
  candidate_fraction: 0.1
  bank_ratio: null
  bank_size: 10000
  coreset_projection_dim: 128
  patch_neighbors: 1
  patch_reduction: nearest
  reweight: true
  reweight_neighbors: 9
  batch_size: 4
  feature_dtype: float16

preprocess:
  long_side: 960
