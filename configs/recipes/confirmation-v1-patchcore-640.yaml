# FROZEN confirmation recipe v1 (ADR-11). Do not edit: a change needs a new ADR and a new file.
#
# The configuration E04 selected on the development categories: PatchCore reference,
# 640 px long side, a memory bank fixed at 10,000 entries. Compose after a data config:
#   inspector run -c configs/data/visa_pcb1.yaml -c configs/recipes/confirmation-v1-patchcore-640.yaml \
#                 --role confirmation --categories <confirmation categories> --seeds 0 1 2

experiment:
  tier: T3
  owner: own

model:
  name: patchcore
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  patch_pool: 3
  projection_dim: 1024
  candidate_fraction: 0.1
  bank_ratio: null
  bank_size: 10000
  coreset_projection_dim: 128
  patch_neighbors: 1
  patch_reduction: nearest
  reweight: true
  reweight_neighbors: 9
  batch_size: 4
  feature_dtype: float16

preprocess:
  long_side: 640
