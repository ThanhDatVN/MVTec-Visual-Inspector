# FROZEN candidate v4 (ADR-15): the submission recipe for MVTec's server. Not a single model: the
# maxima of two components' maps, each divided by the 95th percentile of its own validation
# pixels at a quarter of native resolution (scripts/ad2_e21_fusion.py), then masks from the fused
# validation maps' 95th percentile x 1.25 with morphological post-processing and the image mark
# (inspector.postproc.binarize.MaskRule). Every setting below was chosen on test_public
# (development) as one global setting for all eight categories; none per category.
# Export: scripts/server_export_submission.py --recipe configs/recipes/candidate-v4-fusion.yaml

submission:
  components:
    - configs/recipes/candidate-v4-component-dinov3l.yaml
    - configs/recipes/candidate-v3-patchcore-1280.yaml
  fusion: max
  threshold: p95
  gain: 1.25
  mask: morph
  mask_rule:
    lower: 0.8
    closing_radius: 26
    closing_angles: 16
    erosion: 1
    work_downscale: 4
    fill: true
    mark: 0.9
